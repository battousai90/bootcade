<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootcade：ゲーム別ランキング</title>
<meta name="description" content="1本のゲームの全ランキング。公開されたすべてのスコア、記録保持者、そして順位の移り変わり。">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/leaderboard/leaderboard.css?v=29">
<link rel="stylesheet" href="/leaderboard/game/game.css?v=1">
<link rel="canonical" href="https://bootcade.netlify.app/ja/leaderboard/game/">
<link rel="alternate" hreflang="en" href="https://bootcade.netlify.app/leaderboard/game/">
<link rel="alternate" hreflang="fr" href="https://bootcade.netlify.app/fr/leaderboard/game/">
<link rel="alternate" hreflang="es" href="https://bootcade.netlify.app/es/leaderboard/game/">
<link rel="alternate" hreflang="de" href="https://bootcade.netlify.app/de/leaderboard/game/">
<link rel="alternate" hreflang="pt" href="https://bootcade.netlify.app/pt/leaderboard/game/">
<link rel="alternate" hreflang="ja" href="https://bootcade.netlify.app/ja/leaderboard/game/">
<link rel="alternate" hreflang="zh" href="https://bootcade.netlify.app/zh/leaderboard/game/">
<link rel="alternate" hreflang="th" href="https://bootcade.netlify.app/th/leaderboard/game/">
<link rel="alternate" hreflang="x-default" href="https://bootcade.netlify.app/leaderboard/game/">

<meta property="og:locale" content="ja">
<meta property="og:type" content="website">
<meta property="og:title" content="Bootcade：ゲーム別ランキング">
<meta property="og:description" content="1本のゲームの全ランキング。公開されたすべてのスコア、記録保持者、そして順位の移り変わり。">
<meta property="og:image" content="https://bootcade.netlify.app/og.png">
<meta name="twitter:card" content="summary_large_image">

<!-- Une page de jeu est une adresse par jeu, pas une entree de catalogue :
     elle n'a rien a faire dans l'index des moteurs tant qu'elle est vide de
     son jeu. Le contenu arrive par parametre, donc une seule URL nue serait
     indexee 489 fois a l'identique. -->
<meta name="robots" content="noindex, follow">

<script>
(function () {
  try {
    var m = localStorage.getItem('fbneo-theme');
    if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
  } catch (e) {}
})();
</script>
</head>
<body class="lb-page gp-page">

<header>
  <div class="wrap nav">
    <a class="brand" data-href="home" href="/ja/" style="color:inherit">
      <img src="/logo.svg" alt="">
      <span>Bootcade<small data-i18n="brand.sub">Linux 向けアーケードライブラリ</small></span>
    </a>
    <nav class="nav-links">
      <a data-href="leaderboard" href="/ja/leaderboard/" data-i18n="gp.back">← ランキング</a>
      <a data-href="catalog" href="/ja/catalog/" data-i18n="nav.catalog">カタログ</a>
      <button type="button" id="theme-btn" class="theme-btn" aria-label="Theme" title="Theme">
        <svg class="ico-sys"   viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zm0 1.5v10a5 5 0 010-10z" fill="currentColor"/></svg>
        <svg class="ico-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="ico-dark"  viewBox="0 0 16 16" aria-hidden="true"><path d="M13.3 9.6A5.8 5.8 0 016.4 2.7a5.9 5.9 0 106.9 6.9z" fill="currentColor"/></svg>
      </button>
      <span class="nav-account" id="nav-account"></span>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- Tableau de bord.
         Toute la page tient dans la hauteur disponible : deux zones
         empilees, et c'est la zone du bas qui absorbe ce qui reste. Rien
         ici n'a de hauteur fixe, le classique « une section apres l'autre »
         est justement ce qui faisait defiler la page. -->
    <div class="gp-dash">

      <!-- Fil d'Ariane : rempli par game.js, parce que le systeme et le titre
           ne sont connus qu'une fois le jeu identifie. -->
      <nav class="gp-crumbs" id="gp-crumbs" aria-label="Breadcrumb"></nav>

      <!-- Un seul endroit dit ce qui ne va pas : jeu absent de l'URL, jeu
           inconnu du service, service injoignable. Trois situations
           differentes, trois phrases differentes, jamais une page vide. -->
      <p class="lb-status" id="gp-status" hidden></p>

      <!-- Zone haute : le jeu a gauche, sa fiche de service a droite. -->
      <section class="gp-top" id="gp-hero" hidden>
        <div class="gp-hero">
          <div class="gp-art" id="gp-art"></div>
          <div class="gp-ident">
            <h1 id="gp-title"></h1>
            <p class="gp-rom" id="gp-rom"></p>
            <div class="gp-chips" id="gp-chips"></div>
            <p class="gp-desc" id="gp-desc"></p>
            <p class="gp-actions" id="gp-actions"></p>
          </div>
        </div>
        <aside class="gp-support" id="gp-support"></aside>
      </section>

      <!-- Zone basse : le classement a gauche, les cartes du joueur a
           droite. C'est elle qui prend toute la hauteur restante. -->
      <div class="gp-cols" id="gp-cols" hidden>
        <div class="gp-main">
          <div class="gp-tabs" role="tablist">
            <button type="button" class="gp-tab" id="gp-tab-board" role="tab"
                    aria-controls="gp-panel-board" aria-selected="true"
                    data-panel="board"><i class="gp-tab-ico" data-ico="trophy"></i><span data-i18n="gp.tab.board">世界ランキング</span></button>
            <button type="button" class="gp-tab" id="gp-tab-mine" role="tab"
                    aria-controls="gp-panel-mine" aria-selected="false"
                    data-panel="mine"><i class="gp-tab-ico" data-ico="user"></i><span data-i18n="gp.tab.mine">自分のスコア</span></button>
            <button type="button" class="gp-tab" id="gp-tab-info" role="tab"
                    aria-controls="gp-panel-info" aria-selected="false"
                    data-panel="info"><i class="gp-tab-ico" data-ico="info"></i><span data-i18n="gp.tab.info">ゲーム情報</span></button>
          </div>

          <section class="lb-card gp-panel" id="gp-panel-board" role="tabpanel" aria-labelledby="gp-tab-board">
            <div id="gp-board"></div>
            <!-- « Personne n'a encore joue » se dit SOUS le tableau, pas a la
                 place : la carte reste celle du jeu. -->
            <p class="gp-board-note" id="gp-board-note" hidden></p>
            <nav class="gp-pager" id="gp-pager" hidden></nav>
          </section>

          <section class="lb-card gp-panel" id="gp-panel-mine" role="tabpanel" aria-labelledby="gp-tab-mine" hidden>
            <div id="gp-mine"></div>
          </section>

          <section class="lb-card gp-panel" id="gp-panel-info" role="tabpanel" aria-labelledby="gp-tab-info" hidden>
            <div id="gp-info"></div>
          </section>
        </div>

        <aside class="gp-side">
          <section class="lb-card" id="gp-you-card">
            <h2><i class="gp-card-ico" data-ico="user"></i><span data-i18n="gp.you.h2">自己ベスト</span></h2>
            <div id="gp-you"></div>
          </section>
          <section class="lb-card">
            <h2><i class="gp-card-ico" data-ico="chart"></i><span data-i18n="gp.stats.h2">ゲームの記録</span></h2>
            <div id="gp-stats"></div>
          </section>
          <section class="lb-card gp-side-links">
            <h2><i class="gp-card-ico" data-ico="link"></i><span data-i18n="gp.links.h2">関連リンク</span></h2>
            <div id="gp-links"></div>
          </section>
        </aside>
      </div>

    </div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/auth.js"></script>
<script src="/auth-ui.js"></script>
<script src="/leaderboard/game/game.js?v=1"></script>
</body>
</html>
