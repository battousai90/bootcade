<body class="lb-page gal-page">

<header>
  <div class="wrap nav">
    <a class="brand" data-href="home" href="/de/" style="color:inherit">

      <span class="nav-account" id="nav-account"></span>
    </nav>
  </div>
</header>

<main>
  <div class="wrap lb-head">
    <h1 data-i18n="gal.h1">Galerie</h1>
    <p class="lead" data-i18n="gal.lead">Bootcade auf dem Bildschirm: die Spielebibliothek, die ROM-Verwaltung, die Controller und die Einstellungen.</p>
  </div>

  <div class="wrap gal-block">
    <!-- Filtres et grille remplis par gallery.js a partir de shots.json. -->
    <div class="gal-filters" id="gal-filters" role="toolbar" aria-label="Filter"></div>
    <div class="gal-grid" id="gal-grid"></div>
    <p class="lb-empty gal-empty" id="gal-empty" hidden data-i18n="gal.empty">Noch keine Screenshots.</p>
  </div>
</main>

<!-- Visionneuse plein ecran. <dialog> donne gratuitement le piege du focus,
     Echap et le fond inerte. -->
<dialog class="gal-lightbox" id="gal-lightbox" aria-label="Screenshot">
  <figure class="gal-lb-figure">
    <img id="gal-lb-img" alt="">
    <figcaption class="gal-lb-cap">
      <span class="gal-lb-title" id="gal-lb-title"></span>
      <span class="gal-lb-desc" id="gal-lb-desc"></span>
    </figcaption>
  </figure>
  <span class="gal-lb-count" id="gal-lb-count"></span>
  <button type="button" class="gal-lb-btn gal-lb-close" id="gal-lb-close" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="gal-lb-btn gal-lb-prev" id="gal-lb-prev" aria-label="Previous">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="gal-lb-btn gal-lb-next" id="gal-lb-next" aria-label="Next">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</dialog>
